name: Monthly DART Financial Data Agent

on:
  schedule:
    # 매월 1일 UTC 00:00 (한국 시간 오전 9시) 자동 실행
    - cron: '0 0 1 * *'
  workflow_dispatch: # 필요 시 수동 실행 가능

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DART Fetch Script
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python scripts/fetch_dart.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update DART financial data ($(date +'%Y-%m-%d'))"
            git push
          fi
